# The api (Fastify), and the only thing this machine serves publicly.
#
# Topology: the web is built and hosted by Vercel on tenderpilot.ouedghiri.dev.
# This VPS runs api + worker + postgres + redis. The browser is the only client
# the api ever has - the Next.js app does no server-side fetching - so CORS and
# the session cookie are the whole contract between the two halves.
#
# Why a subdomain and not a /api path: the api serves its routes at the root
# (/auth, /tenders, /analyses, /health), so a path prefix would need a rewrite
# and would break the session cookie's Path.
#
# The cookie is `HttpOnly; SameSite=Lax; Secure`, host-only. Lax is enough
# because tenderpilot.ouedghiri.dev (Vercel) and api.tenderpilot.ouedghiri.dev
# (here) share the registrable domain ouedghiri.dev - the calls are same-site.
# Put the Vercel app on a *.vercel.app URL instead and this stops being true:
# the cookie would need SameSite=None, which is a real loss of CSRF protection.
#
# Secure requires TLS, so a login will not stick until certbot has run.
#
#   sudo cp docs/nginx/api.tenderpilot.ouedghiri.dev.conf /etc/nginx/sites-available/api.tenderpilot.ouedghiri.dev
#   sudo ln -s /etc/nginx/sites-available/api.tenderpilot.ouedghiri.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.tenderpilot.ouedghiri.dev
#
# Installed as plain HTTP: certbot adds the 443 block and the redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name api.tenderpilot.ouedghiri.dev;

    # EX-01 uploads a dossier as a PDF. Must stay above MAX_UPLOAD_MB (25) in
    # .env: below it, nginx returns a 413 before the api sees the request, and
    # the error the user gets is not the api's own `{ error, code }` shape.
    client_max_body_size 32m;

    # Must match API_HOST_PORT in .env. The container publishes on loopback
    # only, so nginx is the sole way in.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS is answered by the api itself (@fastify/cors, origin=WEB_ORIGIN,
        # credentials=true). nginx adds no CORS header: two sources of
        # Access-Control-Allow-Origin is a duplicated-header bug, not redundancy.

        # Uploads and the analysis kickoff are the slow calls. The analysis
        # itself runs in the worker and is polled, so 120s is generous.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        proxy_request_buffering off;
    }
}
