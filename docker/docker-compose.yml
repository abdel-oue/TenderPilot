# Acceptance test for this file: `npm run up` on a clean clone starts everything
# and runs migrations + seed. Five services, one command.
#
# Every path below is relative to THIS directory, because that is what Compose
# resolves against - so the build context is `..`, the repo root, which is what
# both images need (web and api both import packages/shared).
#
# `.env` lives at the repo root, not here, so it is passed explicitly - and a
# SECOND env file follows it, because Compose lets the last one win:
#   docker compose -f docker/docker-compose.yml --env-file .env --env-file docker/.env.local up -d --build
# `npm run up` is that line, preceded by `node scripts/localSecrets.mjs`, which
# writes docker/.env.local the first time with a POSTGRES_PASSWORD and JWT_SECRET
# generated for THIS machine. Compose has no generator of its own, so that is
# where the randomness lives; the file is gitignored and per-installation, so no
# two people - and not production - share a database password.
#   `npm run up:vps` deliberately passes only `--env-file .env`: on the server
# that file holds the real credentials and nothing should override them.

name: tenderpilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # Locally this is the value generated into docker/.env.local, not the one
      # in .env. Postgres only applies it while initialising an EMPTY volume: on
      # an existing pgdata it keeps the old password and the api dies on 28P01.
      # The README's ALTER USER line realigns the role without losing the data.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume. Drop the volume to re-run it.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Published for local psql/drizzle-kit only, and bound to loopback so it is
    # never reachable from outside the host. The host port is a variable because
    # a VPS usually already has a postgres sitting on 5432.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    environment: &api_env
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LLM_URL: ${LLM_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OCR_LANG: ${OCR_LANG}
      # Absolute inside the container, so it lands on the named volume below
      # rather than in the image's writable layer (which a rebuild throws away).
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      STUB_LLM: ${STUB_LLM}
    volumes: &api_volumes
      # The corpus is gitignored and .dockerignore'd: mounted, never baked in.
      - ../apps/api/src/db/seed/data:/app/apps/api/src/db/seed/data:ro
      # Uploads are user data. On a named volume, shared with the worker (which
      # OCRs them) and surviving `docker compose up --build`.
      - uploads:/app/uploads
    # Migrate, then seed, then serve. The seed is idempotent, so this is safe
    # on every restart.
    command: >
      sh -c "node src/db/migrate.js && node src/db/seed/index.js && node src/server.js"
    # Same number inside and out: the api listens on 4000 and is published on
    # it can sit beside whatever else the machine already runs. Loopback-only:
    # nginx is the single public entrypoint.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    # The api IMAGE with a different command. No build block: compose reuses it.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    environment: *api_env
    volumes: *api_volumes
    # Index the company corpus, then serve. Indexing is idempotent and skips
    # anything already embedded, so this is cheap on every restart but the first.
    # `;` not `&&`: a failed index must still leave a worker running.
    command: sh -c "node src/db/reindex.js; node src/worker.js"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NODE_ENV: production
      PORT: 4100
    # Same number inside and out; host side configurable, loopback-only.
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4100}:4100"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
